name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  cpu:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: jdx/mr-boxington-action@v1
      - run: mbx fmt --check
      - run: mbx test --locked --all-targets
      - run: mbx clippy --locked --all-targets -- -D warnings

  wgpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: jdx/mr-boxington-action@v1

      - name: Install Mesa Vulkan Drivers
        run: sudo apt update && sudo apt install -y mesa-vulkan-drivers
      - run: mbx test --locked --no-default-features --features wgpu --all-targets
      - run: mbx clippy --locked --no-default-features --features wgpu --all-targets -- -D warnings
      - run: mbx test --locked --no-default-features --features wgpu --test wgpu wgpu_initializes_and_reads_back_small_tensor -- --ignored --exact --test-threads=1
      - run: mbx test --locked --features wgpu --test wgpu invalid_wgpu_configuration_keeps_jsonl_requests_recoverable
