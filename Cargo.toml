[package]
name = "bdecide"
version = "0.1.0"
edition = "2024"
license = "BlueOak-1.0.0"

[workspace]
members = ["tests/downstream"]

[workspace.lints.clippy]
get_unwrap = "warn"
indexing_slicing = "warn"
panic = "warn"
panic_in_result_fn = "warn"
# Don't Panic - prevent panics from unwraps and unsafe slicing or indexing
string_slice = "warn"
todo = "warn"
unchecked_time_subtraction = "warn"
unimplemented = "warn"
unreachable = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"
# Optional - see post for caveats
# expect_used = "warn"
# arithmetic_side_effects = "warn"

assertions_on_result_states = "warn"
# Don't Fail Silently - prevent dropped futures and swallowed errors
let_underscore_future = "warn"
let_underscore_must_use = "warn"
map_err_ignore = "warn"
unused_result_ok = "warn"

# Don't Do Bad Async Stuff - prevent deadlocks and concurrency bugs
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
if_let_mutex = "warn"  # only relevant on editions before 2024
large_futures = "warn"

# Don't Do Unsafe Things with Memory
mem_forget = "warn"
multiple_unsafe_ops_per_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"

cast_sign_loss = "warn"
# Don't Do Potentially Incorrect Things with Numbers
float_cmp = "warn"
float_cmp_const = "warn"
invalid_upcast_comparisons = "warn"
lossy_float_literal = "warn"
# Optional - these effectively force you to document numeric invariants
# cast_possible_wrap = "warn"
# cast_precision_loss = "warn"
# cast_possible_truncation = "warn"

dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"
iter_not_returning_iterator = "warn"
# Don't Do Bad Things That are Easy to Avoid
rc_mutex = "warn"

# Don't `allow` Your Way Around These Lints - every suppression must be
# a deliberate #[expect(..., reason = "…")] rather than a silent #[allow]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[dependencies]
bon = "3.10"
burn = { version = "0.22", default-features = false, features = ["linalg", "pytorch", "safetensors", "signal", "std"] }
burn-std = { version = "0.22", default-features = false, features = ["std"] }
camino = { version = "1", features = ["serde1"] }
dirs = "7"
hf-hub = { version = "1", features = ["blocking"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
indexmap = { version = "2", features = ["serde"] }
itertools = "0.15"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
symphonia = { version = "0.6", features = ["all"] }
thiserror = "2"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
usage = { package = "usage-rs", version = "6" }

[dev-dependencies]
approx = "0.5"
proptest = "1"
rstest = "0.27"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
usage = { package = "usage-rs", version = "6", features = ["test"] }
wiremock = "0.6"

[features]
default = ["cpu"]
cpu = ["burn/flex"]
# Keep autotune and fusion disabled until GPU crashes and binding limits are resolved,
# e.g. long Qwen sequences exceed WGPU's storage-buffer limit with fusion enabled.
wgpu = ["burn/wgpu"]

[lints]
workspace = true

[profile.release]
strip = true
lto = true
